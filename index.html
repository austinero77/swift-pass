
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPass | Ticketing & Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        .ticket-perforation {
          background-image: radial-gradient(circle at 0px 10px, transparent 0, transparent 10px, white 10px);
          background-size: 100% 20px;
        }

        @keyframes scan {
          0%, 100% { top: 0%; }
          50% { top: 100%; }
        }
        .scan-line {
          height: 2px;
          background: #3b82f6;
          box-shadow: 0 0 15px #3b82f6;
          position: absolute;
          width: 100%;
          animation: scan 2s infinite ease-in-out;
        }
    </style>
